# Runs the kit's examples/ files inside a small sample app.
#
# This workflow is for the kit itself; you don't need it in your own app.
# Your app runs the examples through ci.yml, as part of its own tests and lint.
#
# The sample app copies examples/ in before every run (see
# sample-app/scripts/sync-examples.mjs), lints and type-checks them, runs the
# tests with coverage, and writes the coverage table, the same steps ci.yml
# runs in a real app. If an example stops working, this job goes red.

name: Examples

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sample-app

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      # Every file in the sample app is imported by a test, so the run above
      # can't tell whether untested files are counted. This adds one that
      # nothing imports and checks that it fails the coverage thresholds.
      - name: Check the coverage gate counts untested files
        run: npm run check:coverage-gate

      # The same summary step as ci.yml, so the copy users take is exercised.
      - name: Summarize coverage
        if: ${{ always() && hashFiles('sample-app/coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const metrics = ["statements", "branches", "functions", "lines"];
            const rows = metrics.map(m => `| ${m} | ${total[m].pct}% |`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## Coverage", "", "| Metric | Total |", "| --- | ---: |", ...rows, ""
            ].join("\n"));
          '
